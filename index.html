
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick Bot Manager</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080e19;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 background:#101c30;padding:22px;
 border-bottom:1px solid #24466c;
 color:#48aaff;font-size:22px;font-weight:bold;
}
main{max-width:950px;margin:35px auto;padding:15px}
h1{font-size:27px}
.sub{color:#91a7c3}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:15px;margin:25px 0;
}
.card,.bot,.logs{
 background:#111f34;border:1px solid #25466b;
 border-radius:12px;padding:20px;
}
.number{font-size:30px;color:#48aaff;font-weight:bold}
.label{color:#91a7c3;font-size:13px}
.bots{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:15px;
}
.bot h3{margin-top:0}
.status{color:#a0b2ca;font-size:13px}
button{
 padding:11px 18px;border:0;border-radius:7px;
 cursor:pointer;font-weight:bold;margin:10px 5px 0 0;
}
.start{background:#1688ed;color:white}
.stop{background:#263c58;color:white}
.upload{background:#1688ed;color:white}
.logs{margin-top:15px;color:#9db2cc;min-height:75px}
@media(max-width:600px){
 .stats{grid-template-columns:1fr}
 .bots{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>🤖 KICK BOT MANAGER</header>

<main>
<h1>Kontrol Merkezi</h1>
<p class="sub">Python botlarını tek panelden yönet.</p>

<div class="stats">
 <div class="card">
  <div class="number" id="active">0</div>
  <div class="label">Çalışan bot</div>
 </div>
 <div class="card">
  <div class="number">5</div>
  <div class="label">Toplam bot kapasitesi</div>
 </div>
 <div class="card">
  <div class="number" id="closed">5</div>
  <div class="label">Kapalı bot</div>
 </div>
</div>

<h2>Botlarım</h2>
<div class="bots" id="bots"></div>

<h2>İşlem Kayıtları</h2>
<div class="logs" id="logs">Henüz işlem yapılmadı.</div>

</main>

<script>
const botList=[
 {name:"Kick Bot 1",file:"bot1.py",running:false},
 {name:"Kick Bot 2",file:"bot2.py",running:false},
 {name:"Kick Bot 3",file:"bot3.py",running:false},
 {name:"Kick Bot 4",file:"bot4.py",running:false},
 {name:"Kick Bot 5",file:"bot5.py",running:false}
];

function writeLog(message){
 const logs=document.getElementById("logs");
 if(logs.textContent==="Henüz işlem yapılmadı.")
 logs.textContent="";
 const line=document.createElement("p");
 line.textContent=new Date().toLocaleTimeString("tr-TR")+" - "+message;
 logs.prepend(line);
}

function update(){
 const area=document.getElementById("bots");
 area.innerHTML="";
 botList.forEach((bot,i)=>{
  const card=document.createElement("div");
  card.className="bot";
  const title=document.createElement("h3");
  title.textContent="🤖 "+bot.name;
  const file=document.createElement("p");
  file.className="status";
  file.textContent=bot.file;
  const status=document.createElement("p");
  status.className="status";
  status.textContent=bot.running?"🟢 Çalışıyor":"⚫ Kapalı";
  const start=document.createElement("button");
  start.className="start";
  start.textContent="Başlat";
  start.disabled=bot.running;
  start.onclick=()=>change(i,true);
  const stop=document.createElement("button");
  stop.className="stop";
  stop.textContent="Durdur";
  stop.disabled=!bot.running;
  stop.onclick=()=>change(i,false);
  card.append(title,file,status,start,stop);
  area.append(card);
 });
 const active=botList.filter(b=>b.running).length;
 document.getElementById("active").textContent=active;
 document.getElementById("closed").textContent=5-active;
}

function change(i,state){
 botList[i].running=state;
 writeLog(botList[i].name+
 (state?" başlatma isteği gönderildi.":" durdurma isteği gönderildi."));
 update();
}
update();
</script>
</body>
</html>
